services:
  postgres:
    image: postgres:16-alpine
    container_name: familyprojectx-postgres
    environment:
      POSTGRES_DB: family_finance
      POSTGRES_USER: family_finance
      POSTGRES_PASSWORD: family_finance
    ports:
      - "5432:5432"
    volumes:
      - familyprojectx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_finance -d family_finance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  familyprojectx_postgres_data:

spring:
  application:
    name: family-finance-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/family_finance}
    username: ${DB_USERNAME:family_finance}
    password: ${DB_PASSWORD:family_finance}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
